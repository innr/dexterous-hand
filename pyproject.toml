[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dexterous-hand"
version = "0.1.0"
description = "Dexterous hand simulation and control experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mujoco>=3.1,<4",
  "numpy>=1.26,<3",
  "pyserial>=3.5,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
dexterous-hand-sim = "simulation.run_single_finger:main"
dexterous-hand-leap-check = "simulation.run_leap_hand:main"
sts3215-scan = "hardware.scan_sts3215:main"
leap-calibrate-zero = "hardware.calibrate_zero:main"

[tool.setuptools]
packages = ["simulation", "hardware"]

[tool.setuptools.package-data]
simulation = ["models/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
