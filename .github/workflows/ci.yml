name: software-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python 3.12 tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - name: Compile Python modules
        run: python -m compileall -q hardware simulation tests
      - name: Run tests
        run: python -m pytest -q

  cpp:
    name: C++17 build smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Detect C++ sources
        id: detect
        run: |
          if find . -name '*.cpp' -o -name '*.cc' | grep -q .; then
            echo "has_cpp=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cpp=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure and build C++ sources
        if: steps.detect.outputs.has_cpp == 'true'
        run: |
          cmake -S . -B build -DCMAKE_CXX_STANDARD=17
          cmake --build build --parallel
      - name: Report deferred C++ build
        if: steps.detect.outputs.has_cpp == 'false'
        run: echo "No C++ targets are present on main; the C++ job is intentionally deferred."
