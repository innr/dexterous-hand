name: S6-03 ROS2 Jazzy DDS integration
on:
  pull_request:
    paths:
      - "simulation/**"
      - "scripts/s6_ros2_*"
      - "ros2_ws/**"
      - "tests/test_s6_*"
      - "cpp/**"
      - ".github/workflows/s6-ros2.yml"
  push:
    branches: [main]
    paths:
      - "simulation/**"
      - "scripts/s6_ros2_*"
      - "ros2_ws/**"
      - "tests/test_s6_*"
      - "cpp/**"
      - ".github/workflows/s6-ros2.yml"

jobs:
  ros2-jazzy-dds:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: ROS2 Jazzy DDS acceptance
        run: |
          docker run --rm --network host -v "$PWD:/workspace" -w /workspace ros:jazzy-ros-base bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq python3-colcon-common-extensions ros-jazzy-rosidl-default-generators python3-venv python3-pip cmake g++ libgl1 libegl1
            source /opt/ros/jazzy/setup.bash
            colcon --log-base build/s6_ros2_log build --base-paths ros2_ws/src --build-base build/s6_ros2_pkg --install-base build/s6_ros2_install
            source build/s6_ros2_install/setup.bash
            python3 -m venv --system-site-packages /tmp/leap-s6-venv
            source /tmp/leap-s6-venv/bin/activate
            python3 -m pip install "mujoco>=3.1,<4" "numpy>=1.26,<3"
            python3 -m simulation.fetch_leap_menagerie
            cmake -S cpp -B build/s6_ros2_cpp -DCMAKE_BUILD_TYPE=Debug
            cmake --build build/s6_ros2_cpp --parallel 4
            python3 tests/test_s6_command_contract.py
            python3 scripts/s6_ros2_integration.py --bridge build/s6_ros2_cpp/s6_control_bridge --timeout 45
          '
